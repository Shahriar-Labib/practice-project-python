
rules:
  - id: custom.csharp.sql-injection
    languages:
      - csharp
    severity: ERROR
    message: >-
      Potential SQL injection: user input is concatenated into a SQL query.
      Use parameterized queries.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - "CWE-89: SQL Injection"
      owasp:
        - "A03:2021 - Injection"
      vulnerability_class:
        - SQL Injection
    patterns:
      - pattern: '"$SQL" + $INPUT + "$SUFFIX"'
      - metavariable-regex:
          metavariable: $SQL
          regex: '(?i).*\b(SELECT|INSERT|UPDATE|DELETE)\b.*'
